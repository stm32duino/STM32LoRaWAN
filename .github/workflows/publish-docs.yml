name: Publish versioned documentation

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install --yes doxygen graphviz
      - run: python -m pip install -r requirements-docs.txt
      - run: doxygen Doxyfile
      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish development documentation
        if: github.ref == 'refs/heads/main'
        run: |
          mike deploy --push dev
          # Until a release creates "latest", the site root must redirect to dev.
          mike list latest > /dev/null 2>&1 || mike set-default --push dev
      - name: Publish release documentation
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported documentation release tag: $VERSION" >&2
            exit 1
          fi
          latest=$(git tag --list | sort -V | tail -n 1)
          if [[ "$VERSION" == "$latest" ]]; then
            mike deploy --update-aliases --push "$VERSION" latest
            mike set-default --push latest
          else
            mike deploy --push "$VERSION"
          fi
